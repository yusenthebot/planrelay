[project]
name = "planrelay"
version = "0.1.0"
description = "A local, manual planning handoff between web ChatGPT and Codex"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "mypy>=1.15,<2",
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/planrelay/scripts"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["skills/planrelay/scripts"]
