[project]
name = "planrelay"
version = "0.1.0"
description = "Authenticated MCP planning relay with a paired local Codex worker"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1.28,<2",
    "psutil>=7,<8",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "mypy>=1.15,<2",
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
  "types-psutil>=7,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/planrelay/scripts", "src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["skills/planrelay/scripts", "src"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planrelay_bridge"]

[project.scripts]
planrelay = "planrelay_bridge.cli:main"
